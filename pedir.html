<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Armá tu pedido — Venutto Fast Food</title>
    <meta name="description" content="Armá tu pedido de Venutto: elegí, mirá el total y confirmá por WhatsApp.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,600;0,700;0,900;1,700&family=Barlow:wght@300;400;500&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <link rel="stylesheet" href="./css/styles.css">
</head>

<body>

    <!-- ── Navbar ─────────────────────────────────────────────── -->
    <nav class="navbar solido">
        <a class="nav-logo" href="./index.html">
            <img src="./Logo.jpeg" alt="Venutto Logo">
            <div class="nav-logo-texto">Venutto<span>Fast Food</span></div>
        </a>
        <div class="nav-links">
            <a href="./index.html"><i class="bi bi-arrow-left"></i> Volver al inicio</a>
        </div>
    </nav>


    <!-- ── Página de pedido ────────────────────────────────────── -->
    <main class="pedido-page">
        <div class="pedido-head">
            <a class="volver" href="./index.html"><i class="bi bi-arrow-left"></i> Volver al inicio</a>
            <h1>Armá tu pedido</h1>
            <p>Tocá "Agregar" en lo que quieras, sumá adicionales y confirmá por WhatsApp. El total se calcula solo.</p>
        </div>

        <!-- Tabs y cards se generan desde js/menu-data.js -->
        <div class="menu-tabs" id="menu-tabs"></div>
        <div id="menu-paneles"></div>

        <!-- Adicionales -->
        <div style="margin-top:44px;">
            <p class="sec-tag" style="margin-bottom:14px;">Podés sumar</p>
            <div class="extras-grid" id="adicionales-grid"></div>
        </div>
    </main>


    <!-- ── Botón flotante del carrito ──────────────────────────── -->
    <button class="cart-fab" id="cart-fab" type="button" data-abrir-carrito>
        <i class="bi bi-bag-fill"></i>
        <span id="cart-fab-count">0</span> · Mi pedido
        <span class="cart-fab-total" id="cart-fab-total">$0</span>
    </button>


    <!-- ══════════════════════════════════════════════════════════
         DRAWER DEL CARRITO / CHECKOUT
         ══════════════════════════════════════════════════════════ -->
    <div class="drawer-overlay" id="drawer-overlay" data-cerrar-carrito></div>

    <aside class="drawer" id="drawer" aria-label="Tu pedido">
        <div class="drawer-header">
            <h3><i class="bi bi-bag-fill" style="color:var(--naranja)"></i> Tu pedido</h3>
            <button class="drawer-cerrar" type="button" data-cerrar-carrito aria-label="Cerrar">
                <i class="bi bi-x-lg"></i>
            </button>
        </div>

        <div class="drawer-body" id="drawer-body">
            <!-- Items del carrito, adicionales y checkout se generan por JS -->
        </div>

        <div class="drawer-footer">
            <div class="total-row">
                <span class="total-label">Total</span>
                <span class="total-monto" id="total-monto">$0</span>
            </div>
            <button class="btn-enviar" id="btn-enviar" type="button" disabled>
                <i class="bi bi-whatsapp"></i> Confirmar por WhatsApp
            </button>
        </div>
    </aside>

    <!-- Toast -->
    <div class="toast" id="toast"></div>


    <!-- ── Scripts ─────────────────────────────────────────────── -->
    <script src="./js/menu-data.js"></script>
    <script src="./js/app.js"></script>
</body>

</html>
